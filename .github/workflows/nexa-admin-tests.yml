name: Nexa Admin - Testes
on:
  push:
    branches: [feature/nexa-admin-pacote-1]
    paths:
      - 'admin-api/**'
      - '.github/workflows/nexa-admin-tests.yml'
  pull_request:
    paths:
      - 'admin-api/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes do catalogo e publicacao
        working-directory: admin-api
        run: npm test
